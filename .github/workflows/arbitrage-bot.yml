name: Automated Resale Arbitrage Bot

on:
  schedule:
    # Run every 30 minutes to capture newly listed liquid tech deals
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      mock:
        description: 'Run with mock test data'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  arbitrage-scan:
    name: Scrape & Evaluate Liquid Tech Arbitrage Deals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Arbitrage Bot Cycle
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.mock }}" = "true" ]; then
            node scripts/arbitrage-bot.mjs --once --mock
          else
            node scripts/arbitrage-bot.mjs --once
          fi
