<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <title>HintaTutka v9.0</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 340px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1120;
      color: #f1f5f9;
      padding: 14px;
    }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 14px;
      color: #f8fafc;
    }
    .badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.18);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .section {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #94a3b8;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .input {
      width: 100%;
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 7px;
      padding: 7px 9px;
      color: #f8fafc;
      font-size: 11.5px;
      outline: none;
      margin-bottom: 7px;
    }
    .input:focus {
      border-color: #38bdf8;
    }
    .row-btns {
      display: flex;
      gap: 6px;
    }
    .btn {
      flex: 1;
      padding: 6px 9px;
      border-radius: 7px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: #1e293b;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #334155;
      color: #ffffff;
    }
    .btn.primary {
      background: rgba(16, 185, 129, 0.22);
      border-color: rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
    }
    .btn.primary:hover {
      background: rgba(16, 185, 129, 0.35);
    }
    .hint {
      font-size: 10px;
      color: #94a3b8;
      line-height: 1.35;
      margin-top: 5px;
    }
    .watch-list {
      max-height: 165px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .watch-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 7px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-decoration: none;
      color: #f1f5f9;
      font-size: 11px;
    }
    .watch-item:hover {
      border-color: rgba(56, 189, 248, 0.45);
    }
    .watch-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }
    .watch-price {
      font-weight: 800;
      color: #6ee7b7;
      white-space: nowrap;
    }
    .status-toast {
      font-size: 10.5px;
      color: #6ee7b7;
      min-height: 14px;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="head">
    <div class="brand">⚡ HintaTutka <span class="badge">MV3 v9.0</span></div>
    <span id="cache-stat" style="font-size:10px;color:#94a3b8;">Worker Active</span>
  </div>

  <div class="section">
    <div class="section-title">
      <span>☁️ Serverless Edge Proxy</span>
      <span id="proxy-pill" style="color:#94a3b8;font-size:9.5px;">Direct</span>
    </div>
    <input id="proxy-input" class="input" type="url" placeholder="https://hintatutka-proxy.<account>.workers.dev" />
    <div class="row-btns">
      <button id="save-proxy-btn" class="btn primary" type="button">Save Proxy</button>
      <button id="clear-cache-btn" class="btn" type="button">Clear Cache</button>
    </div>
    <div class="hint">Optional Cloudflare Worker URL to mask IP &amp; share 15m edge cache. Leave blank for direct fetching.</div>
  </div>

  <div class="section">
    <div class="section-title">
      <span>⭐ Price Watchlist</span>
      <span id="watch-count">0</span>
    </div>
    <div id="watch-list" class="watch-list">
      <div class="hint">Open any product on Verkkokauppa, Gigantti, Power, Prisma or Tori and click ⭐ to track it.</div>
    </div>
  </div>

  <div id="status-msg" class="status-toast"></div>
  <script src="popup.js"></script>
</body>
</html>
